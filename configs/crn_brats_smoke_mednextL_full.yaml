seed: 7

data:
  train_csv: data/smoke3d/brats_train.csv
  val_csv: data/smoke3d/brats_val.csv
  image_root: data/smoke/brats
  image_col: path
  mask_col: mask
  label_cols: []
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [32, 32]
  in_channels: 4
  slice_context: 3
  slice_context_layout: depth
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 16
  base_channels: 16
  num_classes: 0
  num_seg_classes: 3
  head_uses_context: true
  segmentation_head: unet
  backbone_mode: mednext
  mednext_variant: L
  mednext_kernel_size: 5
  norm_type: group
  group_norm_groups: 8

loss:
  lambda_cls: 0.0
  lambda_seg: 1.0
  lambda_region_supervision: 0.0
  lambda_seg_adjustment: 0.0
  lambda_region_adjustment: 0.35
  lambda_rec: 0.0
  lambda_dis: 0.01
  lambda_adjustment: 0.0
  lambda_cf_stability: 0.0
  lambda_seg_cf_stability: 0.0
  lambda_region_cf_stability: 0.04
  lambda_region_cf_contrastive: 0.08
  lambda_seg_disease_swap: 0.0
  lambda_region_disease_swap: 0.10
  lambda_disease_swap: 0.0
  context_stability_margin: 0.08
  adjustment_contexts: 4
  contrastive_temperature: 0.20

training:
  batch_size: 1
  epochs: 2
  max_train_batches: 2
  lr: 0.00003
  weight_decay: 0.0001
  num_workers: 0
  output_dir: runs/brats_smoke_mednextL_full
  device: auto
  checkpoint_metric: sweep_best_volume/brats/mean_dice
  checkpoint_mode: max
  checkpoint_threshold: 0.5
  checkpoint_threshold_sweep: 0.40,0.45,0.50,0.55,0.60,0.65
  loss_warmup:
    epochs: 2
    start_factor: 0.25
    keys:
      - lambda_dis
      - lambda_region_adjustment
      - lambda_region_cf_stability
      - lambda_region_cf_contrastive
      - lambda_region_disease_swap
