seed: 7

data:
  train_csv: data/brats/brats_train.csv
  val_csv: data/brats/brats_val.csv
  image_root:
  image_col: path
  mask_col: mask
  label_cols:
    - target
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [128, 128]
  in_channels: 4
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 128
  base_channels: 32
  num_classes: 1
  num_seg_classes: 3
  head_uses_context: true

loss:
  lambda_cls: 0.25
  lambda_seg: 1.0
  lambda_rec: 0.05
  lambda_dis: 0.01
  lambda_adjustment: 0.10
  lambda_cf_stability: 0.05
  lambda_seg_cf_stability: 0.02
  lambda_disease_swap: 0.05
  context_stability_margin: 0.10
  adjustment_contexts: 4

training:
  batch_size: 4
  epochs: 50
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 4
  output_dir: runs/brats_crn_multiregion
  device: auto
