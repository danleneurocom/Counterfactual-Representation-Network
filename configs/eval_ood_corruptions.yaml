seed: 7

# ROOD-MRI / TorchIO corruption evaluation — Phase C.4.
# This config is consumed by `src/crn/eval_corruptions.py`. It shares data and
# model settings with the BraTS validation split; corruptions are applied at
# inference time only. Run:
#
#   PYTHONPATH=src python -m crn.eval_corruptions \
#     --checkpoint runs/brats_segonly_unet_causal_contrastive_mednextL/best.pt \
#     --config configs/eval_ood_corruptions.yaml \
#     --severities 1 2 3 4 5
#
# Results: source-domain region Dice, per-(transform, severity) Dice,
# Dice-vs-severity curves per region, and mean Corruption Error (mCE).

data:
  train_csv: data/brats/brats_train.csv
  val_csv: data/brats/brats_val.csv
  image_root:
  image_col: path
  mask_col: mask
  label_cols: []
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [128, 128]
  in_channels: 4
  slice_context: 5
  slice_context_layout: depth
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 128
  base_channels: 32
  num_classes: 0
  num_seg_classes: 3
  head_uses_context: true
  segmentation_head: unet
  backbone_mode: mednext
  mednext_variant: L
  mednext_kernel_size: 5
  norm_type: group
  group_norm_groups: 8

training:
  batch_size: 2
  epochs: 0
  lr: 0.0
  weight_decay: 0.0
  num_workers: 2
  output_dir: runs/eval_ood_corruptions
  device: auto
