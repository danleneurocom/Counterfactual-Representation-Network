seed: 7

# FeTS leave-one-institution-out shared eval config — Phase C.5.
# The runner `src/crn/eval_fets_loio.py` rewrites `data.val_csv` for each site
# before invoking `crn.evaluate`, so the value below is a placeholder.
#
# Expected workflow:
#   1) prepare the per-site FeTS partition CSV (one row per slice with a
#      `site` column) from your approved FeTS access;
#   2) python -m crn.data_fets --partition-csv <path> --output-dir data/fets/loio
#      to produce `data/fets/loio/loio_manifest.csv` + per-site train/test CSVs;
#   3) train one MedNeXt-L CRN per held-out site, saving to
#      runs/fets_loio/holdout_<site>/best.pt;
#   4) python -m crn.eval_fets_loio \
#        --manifest data/fets/loio/loio_manifest.csv \
#        --checkpoints-dir runs/fets_loio \
#        --config configs/eval_ood_fets_loio.yaml

data:
  train_csv: data/fets/loio/placeholder_train.csv
  val_csv: data/fets/loio/placeholder_test.csv
  image_root:
  image_col: path
  mask_col: mask
  label_cols: []
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [128, 128]
  in_channels: 4
  slice_context: 5
  slice_context_layout: depth
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 128
  base_channels: 32
  num_classes: 0
  num_seg_classes: 3
  head_uses_context: true
  segmentation_head: unet
  backbone_mode: mednext
  mednext_variant: L
  mednext_kernel_size: 5
  norm_type: group
  group_norm_groups: 8

training:
  batch_size: 2
  epochs: 0
  lr: 0.0
  weight_decay: 0.0
  num_workers: 2
  output_dir: runs/eval_ood_fets_loio
  device: auto
  checkpoint_metric: sweep_best_volume/brats/mean_dice
  checkpoint_mode: max
