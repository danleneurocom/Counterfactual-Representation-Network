seed: 7

data:
  train_csv: data/smoke/brats_train.csv
  val_csv: data/smoke/brats_val.csv
  image_root: data/smoke/brats
  image_col: path
  mask_col: mask
  label_cols:
    - target
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [32, 32]
  in_channels: 4
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 16
  base_channels: 8
  num_classes: 1
  num_seg_classes: 3
  head_uses_context: true
  backbone_mode: 2d

training:
  batch_size: 2
  epochs: 1
  max_train_batches: 2
  max_val_batches: 1
  lr: 0.0002
  weight_decay: 0.0001
  num_workers: 0
  output_dir: runs/brats_smoke_2d
  device: auto
