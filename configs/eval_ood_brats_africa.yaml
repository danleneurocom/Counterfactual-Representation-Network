seed: 7

# Zero-shot BraTS-Africa (BraTS-SSA) evaluation — Phase C.3.
# No training: `val_csv` is the ONLY split used. Point `--checkpoint` at a
# BraTS-2021-trained CRN (ideally the MedNeXt-L headline run) and call:
#
#   PYTHONPATH=src python -m crn.evaluate \
#     --checkpoint runs/brats_segonly_unet_causal_contrastive_mednextL/best.pt \
#     --config configs/eval_ood_brats_africa.yaml \
#     --split val --batch-size 2 --counterfactual-metrics

data:
  train_csv: data/brats_africa/brats_africa_test.csv  # placeholder; unused when split=val
  val_csv: data/brats_africa/brats_africa_test.csv
  image_root:
  image_col: path
  mask_col: mask
  label_cols: []
  h5_image_key: image
  h5_mask_key: mask
  mask_mode: brats_subregions
  brats_channel_names:
    - ncr_net
    - edema
    - enhancing_tumor
  brats_region_channels:
    WT: [0, 1, 2]
    TC: [0, 2]
    ET: [2]
  image_normalization: minmax
  image_size: [128, 128]
  in_channels: 4
  slice_context: 5
  slice_context_layout: depth
  uncertain_value: 0.0
  missing_label_value: 0.0

model:
  latent_dim: 128
  base_channels: 32
  num_classes: 0
  num_seg_classes: 3
  head_uses_context: true
  segmentation_head: unet
  backbone_mode: mednext
  mednext_variant: L
  mednext_kernel_size: 5
  norm_type: group
  group_norm_groups: 8

# `training` is present so `build_model` can resolve defaults; epochs=0 signals
# "do not train" to any accidental train-entrypoint invocation.
training:
  batch_size: 2
  epochs: 0
  lr: 0.0
  weight_decay: 0.0
  num_workers: 2
  output_dir: runs/eval_ood_brats_africa
  device: auto
  checkpoint_metric: sweep_best_volume/brats/mean_dice
  checkpoint_mode: max
