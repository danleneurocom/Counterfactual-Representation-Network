[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-representation-network"
version = "0.1.0"
description = "Counterfactual Representation Network for fair and interpretable medical imaging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "wandb>=0.17",
    "torch>=2.2",
    "tqdm>=4.66",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
crn-train = "crn.train:main"
crn-eval = "crn.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
